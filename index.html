<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>큰 글씨 가위바위보</title>
    <style>
        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #e9ecef;
        }

        .game-card {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 450px;
            border: 3px solid #333333;
        }

        /* 제목 글씨 크게 */
        h1 {
            margin-top: 0;
            color: #000000;
            font-size: 2.5rem;
            font-weight: 800;
        }

        /* 점수판 글씨 크게 */
        .score-board {
            display: flex;
            justify-content: space-around;
            margin: 1.5rem 0;
            padding: 1.2rem;
            background-color: #f1f3f5;
            border-radius: 16px;
            border: 2px solid #ced4da;
        }

        .score-box p {
            margin: 0;
            font-size: 1.4rem;
            font-weight: bold;
            color: #495057;
        }

        .score-box span {
            font-size: 2.5rem;
            font-weight: 900;
            color: #000000;
        }

        /* 아이콘 및 VS 표시 크게 */
        .display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 2rem 0;
        }

        .player-display p {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 0;
            color: #212529;
        }

        .choice-icon {
            font-size: 5rem;
            margin-top: 0.5rem;
        }

        .vs {
            font-weight: 900;
            color: #d9480f;
            font-size: 2rem;
        }

        /* 승패 결과 글씨 크게 */
        .result-text {
            font-size: 2.2rem;
            font-weight: 900;
            min-height: 3rem;
            margin: 1.5rem 0;
            color: #1864ab;
        }

        /* 버튼 및 아이콘 크게 */
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            background-color: #ffffff;
            border: 4px solid #333333;
            border-radius: 20px;
            padding: 15px 5px;
            font-size: 3.5rem;
            cursor: pointer;
            transition: all 0.1s ease;
            flex: 1;
        }

        .btn:hover {
            background-color: #ffe066;
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div class="game-card">
    <h1>가위바위보 게임</h1>

    <div class="score-board">
        <div class="score-box">
            <p>나</p>
            <span id="player-score">0</span>
        </div>
        <div class="score-box">
            <p>컴퓨터</p>
            <span id="computer-score">0</span>
        </div>
    </div>

    <div class="display">
        <div class="player-display">
            <p>나</p>
            <div id="player-choice" class="choice-icon">❓</div>
        </div>
        <div class="vs">VS</div>
        <div class="player-display">
            <p>컴퓨터</p>
            <div id="computer-choice" class="choice-icon">❓</div>
        </div>
    </div>

    <div id="result" class="result-text">선택하세요!</div>

    <div class="buttons">
        <button class="btn" onclick="play('scissors')" title="가위">✌️</button>
        <button class="btn" onclick="play('rock')" title="바위">✊</button>
        <button class="btn" onclick="play('paper')" title="보">✋</button>
    </div>
</div>

<script>
    const icons = {
        rock: '✊',
        paper: '✋',
        scissors: '✌️'
    };

    let playerScore = 0;
    let computerScore = 0;

    function play(playerChoice) {
        const choices = ['rock', 'paper', 'scissors'];
        const computerChoice = choices[Math.floor(Math.random() * 3)];

        document.getElementById('player-choice').textContent = icons[playerChoice];
        document.getElementById('computer-choice').textContent = icons[computerChoice];

        let resultMessage = '';

        if (playerChoice === computerChoice) {
            resultMessage = '비겼습니다!';
        } else if (
            (playerChoice === 'rock' && computerChoice === 'scissors') ||
            (playerChoice === 'scissors' && computerChoice === 'paper') ||
            (playerChoice === 'paper' && computerChoice === 'rock')
        ) {
            resultMessage = '이겼습니다! 🎉';
            playerScore++;
        } else {
            resultMessage = '졌습니다... 😭';
            computerScore++;
        }

        document.getElementById('result').textContent = resultMessage;
        document.getElementById('player-score').textContent = playerScore;
        document.getElementById('computer-score').textContent = computerScore;
    }
</script>

</body>
</html>
